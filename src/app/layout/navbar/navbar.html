<header class="nav" [class.is-hidden]="hidden()" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="nav__progress" aria-hidden="true"><span #progress></span></div>

  <div class="nav__inner shell">
    <a class="nav__brand" href="#top" [attr.aria-label]="profile.name + ' — back to top'" (click)="go($event, 'top')">
      <span class="nav__mark display">{{ profile.initials }}</span>
      <span class="nav__who">
        <span>{{ profile.name }}</span>
        <span class="nav__role">{{ profile.role }}</span>
      </span>
    </a>

    <nav class="nav__pill glass" aria-label="Primary">
      <span #indicator class="nav__indicator" aria-hidden="true"></span>
      @for (link of links; track link.id) {
        <a
          class="nav__link"
          appScramble
          [attr.data-link]="link.id"
          [href]="'#' + link.id"
          [class.is-active]="active() === link.id"
          [attr.aria-current]="active() === link.id ? 'true' : null"
          (click)="go($event, link.id)"
          >{{ link.label }}</a
        >
      }
    </nav>

    <div class="nav__actions">
      <button
        type="button"
        class="nav__theme"
        [class.is-light]="isLight()"
        [attr.aria-label]="isLight() ? 'Switch to dark mode' : 'Switch to light mode'"
        [attr.aria-pressed]="isLight()"
        appMagnetic="0.3"
        (click)="toggleTheme($event)"
      >
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <mask id="theme-icon-cut">
            <rect x="-4" y="-4" width="32" height="32" fill="#fff" />
            <circle class="theme-icon__cut" cx="17.5" cy="6.5" r="6.5" fill="#000" />
          </mask>
          <circle class="theme-icon__core" cx="12" cy="12" r="8.5" mask="url(#theme-icon-cut)" />
          <g class="theme-icon__rays">
            <path d="M12 1.5v2.2M12 20.3v2.2M1.5 12h2.2M20.3 12h2.2M4.6 4.6l1.55 1.55M17.85 17.85l1.55 1.55M4.6 19.4l1.55-1.55M17.85 6.15l1.55-1.55" />
          </g>
        </svg>
      </button>
      <a class="btn btn--primary btn--sm nav__cta" href="#contact" appMagnetic="0.25" (click)="go($event, 'contact')">
        <span class="btn__label" data-text="Let's talk"><span>Let's talk</span></span>
        <app-arrow />
      </a>
      <button
        type="button"
        class="nav__burger"
        aria-controls="menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMenu()"
      >
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div id="menu" class="menu" [class.is-open]="menuOpen()" [inert]="!menuOpen()">
  <nav class="menu__links" aria-label="Mobile">
    @for (link of links; track link.id; let i = $index) {
      <a class="menu__link display" [href]="'#' + link.id" [style.--i]="i" (click)="go($event, link.id)">
        <span class="menu__text"><span class="menu__num mono">0{{ i + 1 }}</span>{{ link.label }}</span>
      </a>
    }
  </nav>
  <div class="menu__foot">
    <a class="menu__mail mono" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
    <div class="menu__socials">
      @for (s of profile.socials; track s.href) {
        <a class="mono" [href]="s.href" target="_blank" rel="noopener">{{ s.label }} ↗</a>
      }
    </div>
  </div>
</div>
